<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Emergency Helplines</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <h2>Emergency Helplines</h2>
  <p>Important numbers for immediate help</p>
</header>

<section class="helpline-section">
  <div class="helpline-card">
    <h3>Women Helpline</h3>
    <p>24/7 support for women</p>
    <span class="number">181</span>
  </div>

  <div class="helpline-card">
    <h3>Police Emergency</h3>
    <p>Immediate assistance</p>
    <span class="number">112</span>
  </div>

  <div class="helpline-card">
    <h3>Domestic Violence</h3>
    <p>Help against abuse</p>
    <span class="number">1091</span>
  </div>

  <div class="helpline-card">
    <h3>Child Helpline</h3>
    <p>Emergency help for children</p>
    <span class="number">1098</span>
  </div>
</section>

<footer>
  © 2026 Women Safety Awareness
</footer>

</body>
</html>
